# Coordonnées publiées sur les sites d'une liste d'entreprises (prospection Tikette) : lancement à la main, ≈ 1 min.
# La liste arrive par l'entrée « sites » (une adresse par ligne). Le résultat est chiffré avec la clé publique « cle »
# (seul celui qui a la clé privée peut le lire) puis posé sur la branche temporaire « tmp-contacts », effacée après lecture.
name: Contacts des sites
on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites (un par ligne)'
        required: true
      cle:
        description: 'Clé publique (PEM en base64)'
        required: true
permissions:
  contents: write
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Coordonnées
        env:
          SITES: ${{ inputs.sites }}
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf, csv, os, sys
          sys.path.insert(0, 'outils')
          from contacts_sites import trouver
          sites = [s.strip() for s in os.environ['SITES'].replace('\\n', '\n').splitlines() if s.strip()][:400]
          with cf.ThreadPoolExecutor(24) as ex:
              res = list(ex.map(trouver, sites))
          with open('/tmp/contacts.csv', 'w', encoding='utf-8-sig', newline='') as f:
              w = csv.writer(f, delimiter=';'); w.writerow(['Site', 'E-mail', 'Téléphone'])
              for s, (m, t) in zip(sites, res): w.writerow([s, m, t])
          print(sum(1 for m, t in res if m), 'e-mails sur', len(sites))
          PY
      - name: Chiffrer et déposer
        env:
          CLE: ${{ inputs.cle }}
        run: |
          echo "$CLE" | base64 -d > /tmp/pub.pem
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/contacts.csv -out /tmp/contacts.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k -out /tmp/k.enc
          rm -f /tmp/k /tmp/contacts.csv
          mkdir /tmp/sortie && cd /tmp/sortie && cp /tmp/contacts.enc /tmp/k.enc .
          git init -q -b tmp-contacts && git add . && git -c user.name=robot -c user.email=robot@tikette.fr commit -qm "Contacts chiffrés (temporaire) [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-contacts
