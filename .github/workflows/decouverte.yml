# Provisoire : explore les fichiers DATAtourisme « place » et « product » (lancé à la main, puis supprimé).
name: Découverte DATAtourisme
on: workflow_dispatch
jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sSL --fail -o /tmp/place.csv "https://www.data.gouv.fr/api/1/datasets/r/cf247ad9-5bcd-4c8a-8f4d-f49f0803bca1"
          curl -sSL --fail -o /tmp/product.csv "https://www.data.gouv.fr/api/1/datasets/r/0254ad40-3d26-472e-a628-bd9233f22ee0"
          python3 - <<'PY'
          import csv, collections, sys
          csv.field_size_limit(10**9)
          for nom in ('place', 'product'):
              c = collections.Counter(); n = 0; exemples = {}
              with open(f'/tmp/{nom}.csv', encoding='utf-8', newline='') as f:
                  r = csv.DictReader(f)
                  entetes = r.fieldnames
                  for l in r:
                      n += 1
                      cats = [x.split('#')[-1] for x in (l.get('Categories_de_POI') or '').split('|') if x]
                      for x in cats:
                          c[x] += 1
                          exemples.setdefault(x, (l.get('Nom_du_POI') or '')[:50])
              lignes = [f'{nom} : {n} lignes ; colonnes : {entetes}'] + [f'{k} {v} ex. {exemples[k]}' for k, v in c.most_common(170)]
              txt = '%0A'.join(lignes).replace('\r', '')
              print(f'::notice title={nom}::' + txt[:60000])
          PY
