# Provisoire : liste les fichiers du jeu DATAtourisme sur data.gouv.fr (lancé à la main, puis supprimé).
name: Découverte DATAtourisme
on: workflow_dispatch
jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS "https://www.data.gouv.fr/api/1/datasets/5b598be088ee387c0c353714/" > /tmp/d.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/d.json'))
          lignes=[f"{r['id']} | {r['title']} | {r.get('filesize')}" for r in d['resources']]
          print('::notice title=liste::' + '%0A'.join(lignes))
          PY
          curl -sS -L "https://www.data.gouv.fr/api/1/datasets/r/1ad4899d-fab3-4abd-8df7-025004902932" | head -c 2500 > /tmp/t.txt
          python3 -c "print('::notice title=extrait::'+open('/tmp/t.txt',errors='ignore').read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
