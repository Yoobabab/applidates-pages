# Relevé ponctuel : à quoi ressemble le fichier des événements DATAtourisme (colonnes + quelques lignes).
name: Échantillon des événements
on:
  push:
    paths: ['.github/workflows/echantillon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  echantillon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Télécharger le fichier du jour
        run: |
          curl -sSL --fail -o /tmp/fma.csv "https://www.data.gouv.fr/api/1/datasets/r/2c6023f2-ffce-4c1a-9728-bdc020e463b5"
          ls -la /tmp/fma.csv
          mkdir -p outils
          python3 - <<'PY'
          import csv, sys, collections
          csv.field_size_limit(10**9)
          f = open('/tmp/fma.csv', encoding='utf-8', newline='')
          r = csv.reader(f)
          entete = next(r)
          lignes = []
          for i, l in enumerate(r):
              if i < 400: lignes.append(l)
              n = i + 1
          with open('outils/echantillon.txt', 'w', encoding='utf-8') as s:
              s.write(f'{n} lignes\n\nCOLONNES\n')
              for j, c in enumerate(entete): s.write(f'{j}: {c}\n')
              for k in (0, 1, 2, 50, 120, 300):
                  if k < len(lignes):
                      s.write(f'\n--- ligne {k}\n')
                      for j, c in enumerate(entete):
                          v = lignes[k][j] if j < len(lignes[k]) else ''
                          s.write(f'{c}: {v[:400]}\n')
              # Types d'événements les plus fréquents (colonne contenant « type »)
              for j, c in enumerate(entete):
                  if 'type' in c.lower() or 'categ' in c.lower():
                      compte = collections.Counter()
                      for l in lignes:
                          if j < len(l):
                              for t in l[j].split('|'): compte[t.strip()[:120]] += 1
                      s.write(f'\nVALEURS FRÉQUENTES de {c}\n')
                      for t, x in compte.most_common(40): s.write(f'{x}  {t}\n')
          PY
      - name: Enregistrer l'échantillon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/echantillon.txt
          git commit -m "Échantillon du fichier des événements [skip ci]" || true
          git push
