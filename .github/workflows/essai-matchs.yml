# Essai ponctuel : format des calendriers de matchs (à supprimer après).
name: Essai matchs
on:
  push:
    paths: ['.github/workflows/essai-matchs.yml']
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          exec > outils/essai-matchs.txt 2>&1
          for c in ligue-1-2026 champions-league-2026 europa-league-2026 conference-league-2026 ligue-2-2026 top-14-2026; do
            for u in https://fixturedownload.com/feed/json/$c https://fixturedownload.com/view/json/$c; do
              echo "=== $u"
              curl -sSL -m 30 -A "AppliDates/0.9 (contact@shivr.fr)" -o /tmp/f.json -w 'HTTP %{http_code} %{content_type}\n' "$u"
              head -c 700 /tmp/f.json; echo
              python3 -c "
          import json,collections
          d=json.load(open('/tmp/f.json'))
          print('nb', len(d)); print('lieux', sorted(collections.Counter(m.get('Location') for m in d).items()))
          " || true
            done
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/essai-matchs.txt && git commit -m "Essai matchs [skip ci]" && git push
