# Essai ponctuel : temps de réponse et format des comptages Overpass (à supprimer après).
name: Essai Overpass
on:
  push:
    paths: ['.github/workflows/essai-overpass.yml', 'outils/essai-requete.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          exec > outils/essai-resultat.txt 2>&1
          UA="AppliDates/0.8 (contact@shivr.fr)"
          for s in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for f in essai-petite.txt essai-requete.txt; do
              echo "=== $s $f (sans agent)"
              curl -sS -m 40 -w '\nHTTP %{http_code} en %{time_total}s\n' --data-urlencode "data@outils/$f" "$s" | head -c 1500
              echo "=== $s $f (avec agent)"
              curl -sS -m 40 -A "$UA" -H 'Accept: application/json' -w '\nHTTP %{http_code} en %{time_total}s\n' --data-urlencode "data@outils/$f" "$s" | head -c 1500
            done
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/essai-resultat.txt && git commit -m "Résultat essai Overpass [skip ci]" && git push
