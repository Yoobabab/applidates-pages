# Essai ponctuel : temps de réponse et format des comptages Overpass (à supprimer après).
name: Essai Overpass
on:
  push:
    paths: ['.github/workflows/essai-overpass.yml', 'outils/essai-requete.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          exec > outils/essai-resultat.txt 2>&1
          for s in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "=== $s"
            curl -sS -m 60 -w '\nHTTP %{http_code} en %{time_total}s\n' --data-urlencode "data@outils/essai-requete.txt" "$s" | head -c 3000
            echo
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/essai-resultat.txt && git commit -m "Résultat essai Overpass [skip ci]" && git push
