# Chaque semaine : nombre de restos, bars, cinémas, parcs… partout en France (OpenStreetMap, extrait Geofabrik),
# plus les lieux d'activités des offices de tourisme (DATAtourisme, outils/datatourisme.py),
# par carrés de ≈ 5 km, publiés sur la branche « lieux » (réécrite à chaque fois en un seul commit).
# L'appli lit : https://raw.githubusercontent.com/Yoobabab/applidates-pages/lieux/lieux/v1/…
name: Lieux de France
on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['outils/lieux.py', 'outils/datatourisme.py', '.github/workflows/lieux.yml']
permissions:
  contents: write
concurrency:
  group: lieux
  cancel-in-progress: false
jobs:
  lieux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium
      - name: Télécharger la France (OpenStreetMap)
        run: curl -sSL --fail --retry 3 -o /tmp/france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf && ls -lh /tmp/france.osm.pbf
      - name: Garder les lieux utiles
        run: |
          osmium tags-filter /tmp/france.osm.pbf \
            nw/amenity=restaurant,fast_food,bar,pub,cafe,nightclub,cinema,theatre,arts_centre,music_venue,karaoke_box,planetarium,public_bath \
            nw/leisure=bowling_alley,escape_game,amusement_arcade,miniature_golf,water_park,trampoline_park,park,garden,stadium,ice_rink,horse_riding,sauna \
            nw/sport=laser_tag,karting,paintball,climbing_adventure,climbing,canoe,kayak \
            nw/tourism=museum,gallery,viewpoint,theme_park,zoo,aquarium \
            nw/craft=winery nw/shop=wine \
            nw/natural=beach \
            -o /tmp/filtre.osm.pbf --overwrite
          rm /tmp/france.osm.pbf
          ls -lh /tmp/filtre.osm.pbf
      - name: Compter par carrés
        run: python3 outils/lieux.py /tmp/filtre.osm.pbf /tmp/sortie
      - name: Lieux d'activités DATAtourisme (domaines, canoë, musées, sites naturels…)
        continue-on-error: true
        run: |
          curl -sSL --fail --retry 3 -o /tmp/place.csv "https://www.data.gouv.fr/api/1/datasets/r/cf247ad9-5bcd-4c8a-8f4d-f49f0803bca1"
          curl -sSL --fail --retry 3 -o /tmp/product.csv "https://www.data.gouv.fr/api/1/datasets/r/0254ad40-3d26-472e-a628-bd9233f22ee0"
          python3 outils/datatourisme.py /tmp/sortie /tmp/place.csv /tmp/product.csv
      - name: Publier sur la branche « lieux »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/sortie
          git init -q -b lieux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lieux du $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lieux
