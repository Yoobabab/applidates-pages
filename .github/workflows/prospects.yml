# Liste d'entreprises à contacter (espace pro Tikette) : lancement à la main, ≈ 1 min.
# Le CSV est seulement un artefact gardé 1 jour, jamais publié dans le dépôt.
name: Prospects espace pro
on:
  workflow_dispatch:
    inputs:
      departements:
        description: 'Départements (séparés par des virgules)'
        default: '30,84,13,34'
  push:
    branches: [main]
    paths: ['outils/prospects.py', '.github/workflows/prospects.yml']
jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fichiers DATAtourisme
        run: |
          curl -sSL --fail --retry 3 -o /tmp/place.csv "https://www.data.gouv.fr/api/1/datasets/r/cf247ad9-5bcd-4c8a-8f4d-f49f0803bca1"
          curl -sSL --fail --retry 3 -o /tmp/product.csv "https://www.data.gouv.fr/api/1/datasets/r/0254ad40-3d26-472e-a628-bd9233f22ee0"
      - name: Liste
        run: python3 outils/prospects.py /tmp/prospects.csv "${{ inputs.departements || '30,84,13,34' }}" /tmp/place.csv /tmp/product.csv
      - uses: actions/upload-artifact@v4
        with:
          name: prospects
          path: /tmp/prospects.csv
          retention-days: 1
