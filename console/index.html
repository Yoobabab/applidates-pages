  await Promise.all(depots.map(async ([depot, noms]) => {
    try {
      const r = await fetch(`https://api.github.com/repos/${depot}/actions/runs?per_page=30`, { signal: AbortSignal.timeout(6000) });
      if (!r.ok) return;
      const vus = new Set();
      for (const run of (await r.json()).workflow_runs || []) {

// Photo réduite (1600 px, JPEG) avant l'envoi ; les PDF partent tels quels (10 Mo au plus).
async function preparerFichier(fichier) {
  if (fichier.type === 'application/pdf') return { blob: fichier, ext: 'pdf', type: 'application/pdf' };
  const image = await createImageBitmap(fichier).catch(() => null);
  if (!image) throw new Error('Ce fichier n’est pas une image lisible (essaie une photo JPEG ou un PDF).');
  const echelle = Math.min(1, 1600 / Math.max(image.width, image.height));
  const c = document.createElement('canvas');
  c.width = Math.round(image.width * echelle); c.height = Math.round(image.height * echelle);
  c.getContext('2d').drawImage(image, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
  return { blob, ext: 'jpg', type: 'image/jpeg' };
}

async function envoyerJustificatif(fichier, form, etat) {
  etat.className = 'message'; etat.textContent = 'Envoi de la preuve…';
  try {
    if (fichier.size > 10 * 1024 * 1024 && fichier.type === 'application/pdf') throw new Error('PDF trop lourd (10 Mo au plus).');
    const { blob, ext, type } = await preparerFichier(fichier);
    const { data: s } = await sb.auth.getSession();
    const chemin = s.session.user.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await sb.storage.from('justificatifs').upload(chemin, blob, { contentType: type });
    if (error) throw error;
    if (justificatif && justificatif !== chemin) sb.storage.from('justificatifs').remove([justificatif]).catch(() => {});
    justificatif = chemin;
    document.getElementById('depot-titre').textContent = '✓ ' + fichier.name;
    etat.textContent = 'Preuve enregistrée. L’IA lit la facture…';
    const { data, error: e2 } = await sb.functions.invoke('lire-justificatif', { body: { chemin } });
    if (e2 || !data) { etat.className = 'message'; etat.textContent = 'Preuve enregistrée. Lecture automatique indisponible : remplis les cases.'; return; }
    if (data.quoi && !form.quoi.value) form.quoi.value = data.quoi;
    if (data.fournisseur && !form.fournisseur.value) form.fournisseur.value = data.fournisseur;
    if (data.montant) form.montant.value = String(data.montant).replace('.', ',');
    if (data.date) form.le.value = data.date;
    etat.className = 'message ok'; etat.textContent = 'Lu par l’IA : vérifie les cases puis Enregistrer.';
  } catch (err) {
    etat.className = 'message erreur'; etat.textContent = erreur(err);
  }
}

async function voirJustificatif(chemin) {
  const fenetre = window.open('', '_blank');
  const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(chemin, 300);
  if (error) { fenetre && fenetre.close(); return alert(erreur(error)); }
  if (fenetre) fenetre.location = data.signedUrl; else location.href = data.signedUrl;
}

function exporter(avances) {
  const cellule = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lignes = [['Date', 'Qui', 'Quoi', 'Fournisseur', 'Appli', 'Montant TTC', 'Remboursé le', 'Preuve'].map(cellule).join(';')]
    .concat(avances.map((a) => [dateFr(a.le), a.qui, a.quoi, a.fournisseur, a.appli, String(a.montant).replace('.', ','), dateFr(a.rembourse_le), a.justificatif ? 'oui' : 'non'].map(cellule).join(';')));
  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'avances-egg-not-found-' + aujourdhui() + '.csv' });
  document.body.append(a); a.click(); a.remove();
}



window.addEventListener('popstate', () => {
  if (document.getElementById('console').hidden) return;
  const [n, a] = decodeURIComponent(location.hash.slice(1) || 'ensemble').split('/');
  aller(n, a, true);
});
sb.auth.onAuthStateChange((e) => { if (e === 'SIGNED_OUT') { document.getElementById('console').hidden = true; } });
demarrer();
</script>
