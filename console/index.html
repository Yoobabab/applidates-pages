<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console Egg Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --fond: #0F0B18; --panneau: #1A1426; --ligne: rgba(247,241,255,.08); --rouge: #E63950; --creme: #F2EDE3;
    --doux: #8C83A3; --jaune: #FFD166; --vert: #5ED6A0; --bleu: #9AD1FF; --rose: #FF6B9A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--creme); font-family: 'DM Sans', system-ui, sans-serif; }
  body { min-height: 100vh; }
  .titre { font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-weight: 800; }
  .rouge { color: var(--rouge); }
  .doux { color: var(--doux); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* Connexion */
  #connexion { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .carte-connexion { width: 100%; max-width: 380px; background: var(--panneau); border: 1px solid var(--ligne); border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
  .logo { font-size: 26px; }
  .champ { width: 100%; background: var(--fond); border: 1px solid var(--ligne); border-radius: 12px; color: var(--creme); padding: 12px 14px; font-size: 16px; }
  .champ:focus { outline: 2px solid rgba(230,57,80,.6); border-color: transparent; }
  .btn { border: 0; background: var(--rouge); color: #fff; font-weight: 800; border-radius: 999px; padding: 12px 18px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-contour { background: transparent; border: 1px solid rgba(230,57,80,.6); color: var(--rouge); font-weight: 800; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .btn-lien { background: none; border: 0; color: var(--doux); text-decoration: underline; padding: 0; font-size: 13px; }
  .message { font-size: 13px; min-height: 18px; }
  .message.erreur { color: var(--rose); }
  .message.ok { color: var(--vert); }

  /* Console */
  #console { display: flex; min-height: 100vh; }
  nav { width: 230px; flex-shrink: 0; border-right: 1px solid var(--ligne); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  nav .logo { font-size: 18px; padding: 0 10px 2px; }
  nav .qui { font-size: 11px; color: var(--doux); padding: 0 10px 14px; font-weight: 600; word-break: break-all; }
  .rubrique { font-size: 10px; letter-spacing: 1px; color: var(--doux); font-weight: 800; padding: 10px 12px 4px; }
  .onglet { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 0; background: none; color: var(--doux); font-size: 14px; font-weight: 600; text-align: left; width: 100%; }
  .onglet.actif { background: rgba(230,57,80,.15); color: var(--creme); font-weight: 800; }
  .pastille-app { width: 18px; height: 18px; border-radius: 6px; flex-shrink: 0; }
  nav .bas { margin-top: auto; padding: 10px 12px; }
  main { flex: 1; min-width: 0; padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 16px; }
  .entete { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .entete h1 { margin: 0; font-size: 26px; }
  .entete p { margin: 2px 0 0; font-size: 13px; color: var(--doux); }
  .periodes { display: flex; gap: 6px; }
  .periode { border: 1px solid var(--ligne); background: none; color: var(--doux); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 800; }
  .periode.actif { background: var(--rouge); border-color: var(--rouge); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--panneau); border: 1px solid var(--ligne); border-radius: 14px; padding: 13px 15px; }
  .kpi .t { font-size: 11.5px; color: var(--doux); font-weight: 700; }
  .kpi .v { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; margin-top: 3px; }
  .kpi .s { font-size: 11.5px; color: var(--doux); font-weight: 700; }
  .s.monte { color: var(--vert); }
  .s.baisse { color: var(--rose); }
  .grille { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .panneau { background: var(--panneau); border: 1px solid var(--ligne); border-radius: 14px; padding: 15px 17px; min-width: 0; }
  .panneau h2 { margin: 0 0 10px; font-size: 14px; font-weight: 800; }
  .barres { display: flex; gap: 8px; align-items: flex-end; height: 160px; margin-top: 8px; }
  .barre { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; height: 100%; min-width: 0; }
  .barre .b { width: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(var(--rouge), #9B1D3A); position: relative; min-height: 2px; }
  .barre .n { font-size: 11px; font-weight: 800; }
  .barre .l { font-size: 10px; color: var(--doux); white-space: nowrap; }
  .liste-ligne { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--ligne); }
  .liste-ligne:last-child { border-bottom: 0; }
  .vide { font-size: 13px; color: var(--doux); padding: 8px 0; }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .app { background: var(--panneau); border: 1px solid var(--ligne); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .app .nom { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .app .chiffres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .app .chiffre { background: var(--fond); border-radius: 10px; padding: 8px 10px; }
  .app .chiffre b { display: block; font-size: 18px; }
  .app .chiffre span { font-size: 11px; color: var(--doux); }
  .etiquette { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 9px; align-self: flex-start; }
  .etiquette.direct { background: rgba(94,214,160,.15); color: var(--vert); }
  .etiquette.attente { background: rgba(140,131,163,.15); color: var(--doux); }
  form.bloc { display: flex; flex-direction: column; gap: 10px; }
  .ligne-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.lab { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--doux); font-weight: 700; }
  .boutons { display: flex; gap: 8px; flex-wrap: wrap; }
  .depot { border: 1.5px dashed rgba(230,57,80,.5); border-radius: 12px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--doux); font-size: 12.5px; text-align: center; padding: 12px; cursor: pointer; position: relative; }
  .depot.survol { background: rgba(230,57,80,.08); }
  .depot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .depot .gros { font-size: 22px; color: var(--rouge); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10.5px; color: var(--doux); font-weight: 800; letter-spacing: .5px; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--ligne); }
  td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
  td.montant, th.montant { text-align: right; font-weight: 800; white-space: nowrap; }
  .tableau { overflow-x: auto; }
  .greg { color: var(--rouge); font-weight: 800; }
  .yvan { color: var(--bleu); font-weight: 800; }
  .mini { font-size: 11px; padding: 4px 9px; }
  .rembourse { color: var(--vert); font-weight: 800; font-size: 12px; }
  .offre { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--ligne); }
  .offre:last-child { border-bottom: 0; }
  .offre .txt { flex: 1; min-width: 0; }
  .offre .txt b { display: block; font-size: 13.5px; }
  .offre .txt span { font-size: 12px; color: var(--doux); }
  .chargement { color: var(--doux); font-size: 13px; padding: 30px 0; text-align: center; }
  .note-bas { font-size: 12px; color: var(--doux); line-height: 1.5; }

  @media (max-width: 860px) {
    #console { flex-direction: column; }
    nav { width: auto; height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--ligne); flex-direction: row; flex-wrap: wrap; padding: 12px; gap: 4px; }
    nav .logo { width: 100%; }
    nav .qui, nav .rubrique { display: none; }
    nav .onglet { width: auto; padding: 7px 10px; font-size: 13px; }
    nav .bas { margin: 0; padding: 7px 10px; }
    main { padding: 16px 16px 50px; }
    .grille, .ligne-form { grid-template-columns: 1fr; }
    .barres { height: 120px; gap: 4px; }
    .barre .l { font-size: 9px; }
  }
</style>
</head>
<body>

<section id="connexion" hidden>
  <div class="carte-connexion">
    <div class="logo titre"><span class="rouge">E</span>gg <span class="rouge">N</span>ot <span class="rouge">F</span>ound</div>
    <div class="doux" style="font-size:14px;margin-top:-8px">Console du studio. Réservée à admin@ et contact@eggnotfound.fr.</div>
    <form id="form-email" class="bloc">
      <input id="email" class="champ" type="email" autocomplete="email" placeholder="admin@eggnotfound.fr" required>
      <button class="btn" type="submit">Recevoir mon code</button>
    </form>
    <form id="form-code" class="bloc" hidden>
      <div class="doux" style="font-size:13px">Code envoyé à <b id="email-envoye"></b>.</div>
      <input id="code" class="champ" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code reçu par e-mail" required>
      <button class="btn" type="submit">Me connecter</button>
      <button class="btn-lien" type="button" id="changer-email">Changer d’adresse</button>
    </form>
    <div id="message-connexion" class="message"></div>
  </div>
</section>

<section id="console" hidden>
  <nav>
    <div class="logo titre"><span class="rouge">E</span>gg <span class="rouge">N</span>ot <span class="rouge">F</span>ound</div>
    <div class="qui" id="qui"></div>
    <button class="onglet" data-page="ensemble">Vue d’ensemble</button>
    <div class="rubrique">NOS APPLIS</div>
    <button class="onglet" data-page="tikette"><span class="pastille-app" style="background:#FF6B9A"></span>Tikette</button>
    <button class="onglet" data-page="attente" data-app="Shivr"><span class="pastille-app" style="background:#3FA9F5"></span>Shivr</button>
    <button class="onglet" data-page="attente" data-app="Panier Fantôme"><span class="pastille-app" style="background:#8A6BD1"></span>Panier Fantôme</button>
    <button class="onglet" data-page="attente" data-app="robi"><span class="pastille-app" style="background:#2EC4A6"></span>robi</button>
    <div class="rubrique">LE STUDIO</div>
    <button class="onglet" data-page="offres">Offres et Or</button>
    <button class="onglet" data-page="avances">Avances de frais</button>
    <button class="onglet" data-page="sources">Sources des données</button>
    <div class="bas"><button class="btn-lien" id="deconnexion">Se déconnecter</button></div>
  </nav>
  <main id="page"></main>
</section>

<script>
'use strict';
// Console Egg Not Found : lit les chiffres directement dans Supabase (projet de Tikette).
// Rien n'est tapé à la main sauf les avances de frais. Tout est vérifié côté serveur (supabase/console.sql : est_admin).
const URL_SUPABASE = 'https://mmoyrhyimcalnztwpydi.supabase.co';
const CLE_PUBLIQUE = 'sb_publishable_SSawNJhqUZUxxKpzIds7kQ_80hU2NSH';
const sb = window.supabase.createClient(URL_SUPABASE, CLE_PUBLIQUE, { auth: { persistSession: true, storageKey: 'console-enf' } });

const AMBIANCES = { romantique: 'Romantique', loufoque: 'Insolite', potes: 'Entre potes', girlpower: 'Entre copines', match: 'Avant / après match' };
const PLATEFORMES = { viator: 'Viator', getyourguide: 'GetYourGuide', thefork: 'TheFork', funbooker: 'Funbooker', ticketmaster: 'Ticketmaster', autre: 'Autre' };
const APPLIS = ['Studio', 'Tikette', 'Shivr', 'Panier Fantôme', 'robi', 'Hearthaven'];

// ───────── Petits outils (tout le texte passe par textContent : jamais de HTML venu des données) ─────────
function h(tag, attrs, ...enfants) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const e of enfants.flat()) if (e != null && e !== false) el.append(e instanceof Node ? e : String(e));
  return el;
}
const euros = (n) => (Number(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const nombre = (n) => (Number(n) || 0).toLocaleString('fr-FR');
const dateFr = (d) => (d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '');
const aujourdhui = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function evolution(maintenant, avant) {
  if (!avant) return maintenant ? { t: 'nouveau', c: 'monte' } : { t: '—', c: '' };
  const p = Math.round(((maintenant - avant) / avant) * 100);
  return { t: (p > 0 ? '+' : '') + p + ' %', c: p > 0 ? 'monte' : p < 0 ? 'baisse' : '' };
}
function kpi(titre, valeur, sous, couleur, classeSous) {
  return h('div', { class: 'kpi' }, h('div', { class: 't' }, titre), h('div', { class: 'v', style: couleur ? 'color:' + couleur : '' }, valeur), h('div', { class: 's ' + (classeSous || '') }, sous || ''));
}
const page = document.getElementById('page');
function afficher(...enfants) { page.replaceChildren(...enfants); }
function entete(titre, sousTitre, droite) {
  return h('div', { class: 'entete' }, h('div', {}, h('h1', { class: 'titre' }, titre), h('p', {}, sousTitre)), droite || '');
}
function erreur(e) {
  const m = String(e?.message || e || '');
  if (/reserve au studio/i.test(m)) return 'Cette adresse n’a pas accès à la console.';
  if (/function .* does not exist|Could not find the function/i.test(m)) return 'Le script supabase/console.sql n’est pas encore lancé dans Supabase.';
  return 'Erreur : ' + m;
}
async function rpc(nom, args) {
  const { data, error } = await sb.rpc(nom, args || {});
  if (error) throw error;
  return data;
}

// ───────── Connexion par code e-mail ─────────
const msg = document.getElementById('message-connexion');
function dire(texte, ok) { msg.textContent = texte; msg.className = 'message ' + (ok ? 'ok' : 'erreur'); }
document.getElementById('form-email').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const bouton = e.submitter; bouton.disabled = true; dire('');
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  bouton.disabled = false;
  if (error) return dire(/rate|seconds/i.test(error.message) ? 'Patiente une minute avant de redemander un code.' : 'Envoi impossible : ' + error.message);
  document.getElementById('email-envoye').textContent = email;
  document.getElementById('form-email').hidden = true;
  document.getElementById('form-code').hidden = false;
  document.getElementById('code').focus();
  dire('Regarde ta boîte mail (et les indésirables).', true);
});
document.getElementById('form-code').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email-envoye').textContent;
  const token = document.getElementById('code').value.replace(/\D/g, '');
  const bouton = e.submitter; bouton.disabled = true; dire('');
  const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
  bouton.disabled = false;
  if (error) return dire('Code incorrect ou expiré.');
  demarrer();
});
document.getElementById('changer-email').addEventListener('click', () => {
  document.getElementById('form-email').hidden = false;
  document.getElementById('form-code').hidden = true;
  dire('');
});
document.getElementById('deconnexion').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function demarrer() {
  const { data } = await sb.auth.getSession();
  const session = data.session;
  if (!session) {
    document.getElementById('connexion').hidden = false;
    document.getElementById('console').hidden = true;
    return;
  }
  let admin = false;
  try { admin = await rpc('est_admin'); } catch (e) { /* script pas lancé */ }
  if (!admin) {
    await sb.auth.signOut();
    document.getElementById('connexion').hidden = false;
    document.getElementById('form-email').hidden = false;
    document.getElementById('form-code').hidden = true;
    return dire('Cette adresse n’a pas accès à la console.');
  }
  document.getElementById('connexion').hidden = true;
  document.getElementById('console').hidden = false;
  document.getElementById('qui').textContent = 'Console · ' + (session.user.email || '');
  aller(location.hash.slice(1) || 'ensemble');
}

// ───────── Navigation ─────────
const PAGES = { ensemble: pageEnsemble, tikette: pageTikette, offres: pageOffres, avances: pageAvances, sources: pageSources, attente: pageAttente };
document.querySelectorAll('.onglet').forEach((b) => b.addEventListener('click', () => aller(b.dataset.page, b.dataset.app)));
function aller(nom, app) {
  if (!PAGES[nom]) nom = 'ensemble';
  document.querySelectorAll('.onglet').forEach((b) => b.classList.toggle('actif', b.dataset.page === nom && (nom !== 'attente' || b.dataset.app === app)));
  if (nom !== 'attente') history.replaceState(null, '', '#' + nom);
  afficher(h('div', { class: 'chargement' }, 'Chargement…'));
  PAGES[nom](app).catch((e) => afficher(h('div', { class: 'panneau' }, erreur(e))));
}

// ───────── Vue d'ensemble ─────────
async function pageEnsemble() {
  const [t, avances] = await Promise.all([rpc('console_tikette', { p_periode: 'mois' }), rpc('console_avances').catch(() => [])]);
  const total = avances.reduce((s, a) => s + Number(a.montant), 0);
  const reste = avances.filter((a) => !a.rembourse_le).reduce((s, a) => s + Number(a.montant), 0);
  const carteApp = (nom, couleur, enDirect, chiffres, page) =>
    h('div', { class: 'app' },
      h('div', { class: 'nom titre' }, h('span', { class: 'pastille-app', style: 'background:' + couleur }), nom),
      h('span', { class: 'etiquette ' + (enDirect ? 'direct' : 'attente') }, enDirect ? 'Données en direct' : 'À brancher'),
      chiffres ? h('div', { class: 'chiffres' }, chiffres.map(([v, l]) => h('div', { class: 'chiffre' }, h('b', {}, v), h('span', {}, l)))) : h('div', { class: 'doux', style: 'font-size:13px' }, 'Ses chiffres remonteront ici quand elle sera reliée à la console.'),
      page ? h('button', { class: 'btn-contour', style: 'align-self:flex-start', onclick: () => aller(page) }, 'Voir le détail') : '');
  afficher(
    entete('Vue d’ensemble', 'Toutes nos applis · ce mois-ci'),
    h('div', { class: 'kpis' },
      kpi('Comptes Tikette', nombre(t.comptes.total), '+' + nombre(t.comptes.nouveaux) + ' ce mois'),
      kpi('Abonnés Or', nombre(t.or.payants), nombre(t.or.offerts) + ' Or offert en cours', 'var(--jaune)'),
      kpi('Revenus du mois', euros(0), 'Paiement branché avec la vraie version'),
      kpi('Avances à rembourser', euros(reste), 'sur ' + euros(total) + ' avancés', 'var(--rose)')),
    h('div', { class: 'apps' },
      carteApp('Tikette', '#FF6B9A', true, [
        [nombre(t.dates.faits), 'dates faits ce mois'],
        [t.notes.moyenne ? String(t.notes.moyenne).replace('.', ',') + ' ★' : '—', 'note moyenne'],
        [nombre(t.comptes.actifs), 'comptes actifs ce mois'],
        [nombre(t.clics_total), 'clics vers les partenaires'],
      ], 'tikette'),
      carteApp('Shivr', '#3FA9F5', false),
      carteApp('Panier Fantôme', '#8A6BD1', false),
      carteApp('robi', '#2EC4A6', false)));
}

function pageAttente(app) {
  afficher(entete(app || 'Appli', 'Pas encore reliée à la console'),
    h('div', { class: 'panneau' },
      h('p', { style: 'margin:0 0 8px;font-size:14px' }, 'Les chiffres de ' + (app || 'cette appli') + ' remonteront ici automatiquement une fois reliée : il faudra lancer un petit script SQL dans son projet Supabase (comptes du studio + fonction des chiffres), comme pour Tikette.'),
      h('p', { class: 'note-bas', style: 'margin:0' }, 'Règle du studio : chaque nouvelle appli a son espace admin (admin@ et contact@eggnotfound.fr) et apparaît dans cette console.')));
  return Promise.resolve();
}

// ───────── Tikette ─────────
let periode = 'semaine';
async function pageTikette() {
  const t = await rpc('console_tikette', { p_periode: periode });
  const mots = { semaine: 'cette semaine', mois: 'ce mois-ci', annee: 'cette année' };
  const choix = h('div', { class: 'periodes' }, [['semaine', 'Semaine'], ['mois', 'Mois'], ['annee', 'Année']].map(([v, l]) =>
    h('button', { class: 'periode' + (periode === v ? ' actif' : ''), onclick: () => { periode = v; aller('tikette'); } }, l)));
  const evoComptes = evolution(t.comptes.nouveaux, t.comptes.avant);
  const evoDates = evolution(t.dates.faits, t.dates.faits_avant);

// Photo réduite (1600 px, JPEG) avant l'envoi ; les PDF partent tels quels (10 Mo au plus).
async function preparerFichier(fichier) {
  if (fichier.type === 'application/pdf') return { blob: fichier, ext: 'pdf', type: 'application/pdf' };
  const image = await createImageBitmap(fichier).catch(() => null);
  if (!image) throw new Error('Ce fichier n’est pas une image lisible (essaie une photo JPEG ou un PDF).');
  const echelle = Math.min(1, 1600 / Math.max(image.width, image.height));
  const c = document.createElement('canvas');
  c.width = Math.round(image.width * echelle); c.height = Math.round(image.height * echelle);
  c.getContext('2d').drawImage(image, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
  return { blob, ext: 'jpg', type: 'image/jpeg' };
}

async function envoyerJustificatif(fichier, form, etat) {
  etat.className = 'message'; etat.textContent = 'Envoi de la preuve…';
  try {
    if (fichier.size > 10 * 1024 * 1024 && fichier.type === 'application/pdf') throw new Error('PDF trop lourd (10 Mo au plus).');
    const { blob, ext, type } = await preparerFichier(fichier);
    const { data: s } = await sb.auth.getSession();
    const chemin = s.session.user.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await sb.storage.from('justificatifs').upload(chemin, blob, { contentType: type });
    if (error) throw error;
    justificatif = chemin;
    document.getElementById('depot-titre').textContent = '✓ ' + fichier.name;
    etat.textContent = 'Preuve enregistrée. L’IA lit la facture…';
    const { data, error: e2 } = await sb.functions.invoke('lire-justificatif', { body: { chemin } });
    if (e2 || !data) { etat.className = 'message'; etat.textContent = 'Preuve enregistrée. Lecture automatique indisponible : remplis les cases.'; return; }
    if (data.quoi && !form.quoi.value) form.quoi.value = data.quoi;
    if (data.fournisseur && !form.fournisseur.value) form.fournisseur.value = data.fournisseur;
    if (data.montant) form.montant.value = String(data.montant).replace('.', ',');
    if (data.date) form.le.value = data.date;
    etat.className = 'message ok'; etat.textContent = 'Lu par l’IA : vérifie les cases puis Enregistrer.';
  } catch (err) {
    etat.className = 'message erreur'; etat.textContent = erreur(err);
  }
}

async function voirJustificatif(chemin) {
  const fenetre = window.open('', '_blank');
  const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(chemin, 300);
  if (error) { fenetre && fenetre.close(); return alert(erreur(error)); }
  if (fenetre) fenetre.location = data.signedUrl; else location.href = data.signedUrl;
}

function exporter(avances) {
  const cellule = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lignes = [['Date', 'Qui', 'Quoi', 'Fournisseur', 'Appli', 'Montant TTC', 'Remboursé le', 'Preuve'].map(cellule).join(';')]
    .concat(avances.map((a) => [dateFr(a.le), a.qui, a.quoi, a.fournisseur, a.appli, String(a.montant).replace('.', ','), dateFr(a.rembourse_le), a.justificatif ? 'oui' : 'non'].map(cellule).join(';')));
  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'avances-egg-not-found-' + aujourdhui() + '.csv' });
  document.body.append(a); a.click(); a.remove();
}
