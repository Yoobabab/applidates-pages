  const fermes = ferm.filter((f) => f.offre_id === o.id);
  const hVus = o.horaires.filter((h) => jours.some((j) => jourSemaine(j) === h.jour));
  let min = hVus.length ? Math.min(...hVus.map((h) => enMin(h.debut))) : 600, max = hVus.length ? Math.max(...hVus.map((h) => enMin(h.fin))) : 1200;
  min = Math.floor(min / 60) * 60 - 30; max = Math.ceil(max / 60) * 60 + 30; const H = (max - min) * PX, y = (m) => (m - min) * PX;
  const maj = (t) => t.replace(/^./, (x) => x.toUpperCase());

    : jours.map((j) => ({ jour: j, res, titre: maj(fmt(midi(j), { weekday: 'long' })), sous: fmt(midi(j), { day: 'numeric', month: 'short' }) }));
  const grille = `64px repeat(${colonnes.length},${plan.mode === 'jour' ? 'minmax(170px,1fr)' : 'minmax(118px,1fr)'})`;
  const titrePeriode = plan.mode === 'jour' ? maj(jourLong(midi(plan.jour))) : `Semaine du ${fmt(midi(jours[0]), { day: 'numeric', month: 'long' })}`;
  const colonne = (c) => {
    const js = jourSemaine(c.jour); let h = '';
    o.horaires.filter((x) => x.jour === js).forEach((x) => { h += `<div class="ag-ouvert" style="top:${y(enMin(x.debut))}px;height:${(enMin(x.fin) - enMin(x.debut)) * PX}px"></div>`; });
    for (let m = Math.ceil(min / 60) * 60; m < max; m += 60) h += `<div class="ag-ligne" style="top:${y(m)}px"></div>`;
    const ids = c.res.map((r) => r.id), plusieurs = res.length > 1 && plan.mode === 'semaine';
    const nomRes = (id) => res.find((r) => r.id === id)?.nom || '';
    const items = [];

      const lib = f.source === 'ical' ? 'Pris dans votre agenda' : f.motif === 'hors_tikette' ? 'Réservé hors Tikette' : f.motif === 'complet' ? 'Complet' : 'Fermé';
      const sous = [plusieurs ? (f.ressource_id ? nomRes(f.ressource_id) : 'Toutes les salles') : '', f.note].filter(Boolean).map(esc).join(' · ');
      items.push({ a, b, html: (st) => `<div class="ag-bloc ${cls}" data-ferm="${f.id}" data-source="${f.source}" style="${st}"><b>${lib}</b><span>${sous}</span></div>` });

    `<select id="p-offre" style="width:auto">${offres.map((x) => `<option value="${x.id}" ${x.id === o.id ? 'selected' : ''}>${esc(x.titre)}</option>`).join('')}</select>

  + `<div class="outils" style="margin-bottom:12px"><button class="btn p" id="p-auj">Aujourd’hui</button><button class="btn p" id="p-av" aria-label="Précédent">${ic('gauche')}</button><button class="btn p" id="p-ap" aria-label="Suivant">${ic('droite')}</button>

  <div class="ag-corps" style="grid-template-columns:${grille}"><div class="ag-heures" style="height:${H}px">${heuresAxe.join('')}</div>${colonnes.map(colonne).join('')}</div></div>
  <div class="legende"><span><i style="background:var(--vert2);border-color:var(--vert)"></i>Confirmée</span><span><i style="background:var(--ambre2);border-color:#E3A82B"></i>À valider</span>

  $$('[data-m]').forEach((b) => b.onclick = () => { plan.mode = b.dataset.m; planning(); });

let periode = 'mois';

  else if (periode === '3mois') { du = ajouterJours(auj, -90); au = ajouterJours(auj, 1); }
  else { du = auj.slice(0, 4) + '-01-01'; au = (+auj.slice(0, 4) + 1) + '-01-01'; }
  const D = dateParis(du, '00:00').toISOString(), A = dateParis(au, '00:00').toISOString();
  const [st, liste] = await Promise.all([rpc('pro_stats', { p_du: D, p_au: A }), rpc('pro_reservations_liste', { p_du: D, p_au: A })]);

async function pCompte() {

    ${totp ? `<button class="btn non p" id="c-mfa-off">Désactiver</button>` : `<button class="btn prim p" id="c-mfa-on">${ic('bouclier')}Activer</button>`}</div></div>

      pied: `<button class="btn" data-fermer>Annuler</button><button class="btn prim" id="mfa-ok">Activer</button>` });
    $('#mfa-ok', v).onclick = async () => {
      const r = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: $('#mfa-c', v).value.trim() });

  $('#p-corps').innerHTML = `<div class="carte"><h2>${ic('boutique')}Votre partenariat</h2>
    <dl class="champs"><dt>Statut</dt><dd>${{ valide: 'Validé', en_attente: 'En vérification', suspendu: 'Suspendu', refuse: 'Refusé', quitte: 'Terminé' }[e.statut]}</dd>
    <dt>Formule</dt><dd>${e.fondateur ? 'Partenaire fondateur : 0 % jusqu’au 31 mars 2027, puis 8 % à vie' : '10 % des réservations venues de Tikette'}</dd><dt>Taux actuel</dt><dd>${Math.round(e.taux_actuel * 100)} %</dd>
    <dt>Conditions</dt><dd><a href="/pro/#conditions" target="_blank">Conditions partenaires</a></dd><dt>Aide</dt><dd><a href="mailto:contact@tikette.fr">contact@tikette.fr</a></dd></dl></div>
  ${proprio() && e.statut !== 'quitte' ? `<div class="carte" style="margin-top:16px;border-color:#EBC7C7"><h2 style="color:var(--rouge)">${ic('alerte')}Quitter Tikette</h2><p class="note" style="margin:0 0 12px">Vos activités sont retirées de Tikette et les demandes en attente refusées (les clients sont prévenus). Les réservations confirmées restent à honorer. Sans frais.</p>
    <button class="btn non" id="quitter">Mettre fin au partenariat</button></div>` : ''}`;
  if ($('#quitter')) $('#quitter').onclick = async () => {
    const t = await demander({ titre: 'Mettre fin au partenariat ?', texte: 'Pour confirmer, tapez <b>QUITTER</b>.', champ: 'Confirmation', bouton: 'Mettre fin', danger: true });
    if ((t || '').trim().toUpperCase() !== 'QUITTER') return;
    await rpc('pro_quitter'); toast('Partenariat terminé.'); await recharger(); pPart();
  };
}

setInterval(async () => {
  if (!espace) return; const avant = +espace.entreprise.a_valider || 0;
  try { await recharger(); } catch { return; }
  if ((+espace.entreprise.a_valider || 0) > avant) { toast('Nouvelle demande de réservation.', 'cloche'); if (vueActuelle === 'accueil') accueil(); }
}, 60000);
demarrer();
</script>
</body>
</html>
